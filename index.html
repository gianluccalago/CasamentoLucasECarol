    </section>

    <div class="divider" aria-hidden="true">
      <svg class="divider__ramalhete"><use href="#svg-ramalhete"/></svg>
    </div>

    <!-- ==========================================================
         3 · PRESENTES
         ========================================================== -->
    <section class="presentes section" id="presentes">
      <div class="section__inner">
        <h2 class="section__title section__title--centro reveal" id="presentes-titulo"></h2>
        <p class="assinatura assinatura--centro reveal" id="presentes-subtitulo" aria-hidden="true"></p>
        <p class="section__intro reveal" id="presentes-texto"></p>
        <div class="presentes__grid" id="presentes-grid"></div>
      </div>
    </section>

    <div class="divider" aria-hidden="true">
      <svg class="divider__ramalhete"><use href="#svg-ramalhete"/></svg>
    </div>

    <!-- ==========================================================
         4 · CONFIRME SUA PRESENÇA
         ========================================================== -->
    <section class="rsvp section" id="rsvp">
      <div class="section__inner section__inner--narrow">
        <h2 class="section__title section__title--centro reveal" id="rsvp-titulo"></h2>
        <p class="assinatura assinatura--centro reveal" id="rsvp-subtitulo" aria-hidden="true"></p>
        <p class="section__intro reveal" id="rsvp-intro"></p>

        <form class="rsvp__form reveal" id="rsvp-form" novalidate>
          <div class="campo">
            <label class="campo__rotulo" for="rsvp-nome" id="rsvp-rotulo-nome"></label>
            <input class="campo__input" type="text" id="rsvp-nome" name="nome" autocomplete="name" required>
          </div>
          <div class="campo">
            <label class="campo__rotulo" for="rsvp-obs" id="rsvp-rotulo-obs"></label>
            <textarea class="campo__input campo__input--area" id="rsvp-obs" name="observacoes" rows="3"></textarea>
          </div>
          <button class="botao botao--primario" id="rsvp-enviar" type="submit"></button>
        </form>

        <div class="rsvp__sucesso" id="rsvp-sucesso" hidden tabindex="-1">
          <svg class="rsvp__sucesso-icone" aria-hidden="true"><use href="#svg-flor"/></svg>
          <h3 id="rsvp-sucesso-titulo"></h3>
          <p id="rsvp-sucesso-texto"></p>
        </div>
      </div>
    </section>

  </main>

  <!-- ================================================================
       RODAPÉ
       ================================================================ -->
  <footer class="rodape">
    <svg class="rodape__mono" aria-hidden="true"><use href="#svg-monograma"/></svg>
    <p class="rodape__nomes" id="rodape-nomes"></p>
    <p class="rodape__versiculo" id="rodape-versiculo"></p>
    <p class="rodape__versiculo-ref" id="rodape-versiculo-ref"></p>
    <p class="rodape__agradecimento" id="rodape-agradecimento"></p>
    <p class="rodape__data" id="rodape-data"></p>
    <p class="rodape__credito" id="rodape-credito"></p>
  </footer>

  <!-- ================================================================
       JANELA DE PRESENTE (abre ao clicar em "Presentear")
       ================================================================ -->
  <div class="modal" id="modal-presente" hidden role="dialog" aria-modal="true" aria-labelledby="modal-nome">
    <div class="modal__caixa" role="document">
      <button class="modal__fechar" id="modal-fechar" aria-label="Fechar">&times;</button>
      <img class="modal__foto" id="modal-foto" alt="">
      <h3 class="modal__nome" id="modal-nome"></h3>
      <p class="modal__valor" id="modal-valor"></p>

      <p class="modal__rotulo" id="modal-rotulo-escolha"></p>
      <div class="modal__opcoes" id="modal-opcoes"></div>
      <div class="campo campo--valor">
        <label class="campo__rotulo" for="modal-livre" id="modal-rotulo-livre"></label>
        <input class="campo__input" id="modal-livre" type="text" inputmode="decimal" autocomplete="off">
      </div>

      <!-- Modo simples: chave PIX fixa do casal (sem Supabase configurado) -->
      <div id="modal-modo-chave">
        <p class="modal__como" id="modal-como"></p>
        <dl class="modal__pix">
          <div><dt>Banco</dt><dd id="modal-banco"></dd></div>
          <div><dt>Titular</dt><dd id="modal-titular"></dd></div>
          <div><dt>Chave PIX</dt><dd class="modal__chave" id="modal-chave"></dd></div>
        </dl>
        <figure class="modal__qr" id="modal-qr" hidden><img id="modal-qr-img" alt="QR Code do PIX" loading="lazy"></figure>
        <button class="botao botao--primario" id="modal-copiar" type="button"></button>
        <button class="botao botao--texto" id="modal-avisar" type="button"></button>
      </div>

      <!-- Modo automático: gera um PIX pelo Mercado Pago (Supabase ligado) -->
      <div id="modal-modo-mp" hidden>
        <div class="campo">
          <label class="campo__rotulo" for="mp-nome">Seu nome</label>
          <input class="campo__input" id="mp-nome" type="text" autocomplete="name">
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="mp-email">Seu e-mail</label>
          <input class="campo__input" id="mp-email" type="email" autocomplete="email"
                 placeholder="para o comprovante">
        </div>
        <p class="modal__erro" id="mp-erro" hidden></p>
        <button class="botao botao--primario" id="mp-gerar" type="button">Gerar PIX</button>

        <div id="mp-resultado" hidden>
          <p class="modal__como">Aponte a câmera do seu banco para o código, ou copie o texto abaixo.</p>
          <figure class="modal__qr"><img id="mp-qr-img" alt="QR Code do PIX"></figure>
          <button class="botao botao--primario" id="mp-copiar" type="button">Copiar código PIX</button>
          <p class="modal__aviso" id="mp-status">Assim que o pagamento cair, o presente aparece como conquistado.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
